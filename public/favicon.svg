<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Инклюзия в Яндексе">
  <!--
    Значок вкладки: белая «Я» в фирменном красном круге (цвет из токена
    logo-yandex). Тот же знак сайт рисует сам в строке авторства цитат
    Яндекса, поэтому вкладка и страница выглядят одинаково.

    Значок временный: когда заказчик даст официальный файл, этот заменяется.
  -->
  <circle cx="32" cy="32" r="32" fill="#fc3f1d"/>
  <text x="32" y="33" fill="#ffffff" font-family="YS Text, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" text-anchor="middle" dominant-baseline="central">Я</text>
</svg>
